<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <style>
        table,th,tr,td{
            border: 2px solid;
            border-collapse: collapse;
        }
    </style>
    <h1>This is Table Tag</h1>
    <table>
        <tr>
            <th>Sr no</th>
            <th>Name</th>
            <th>Age</th>
            <th>Mobile no</th>
            <th>Contact no</th>
        </tr>
        <tr>
            <td>1</td>
            <td>abc</td>
            <td>23</td>
            <td rowspan="2">9561669019</td>
            <td>9876543210</td>
        </tr>
        <tr>
            <td>2</td>
            <td>xyz</td>
            <td>25</td>
            <td>4567891230</td>
        </tr>
        <tr>
            <td>3</td>
            <td>lmn</td>
            <td>27</td>
            <td colspan="2">1234567890</td>
        </tr>
    </table>
</body>
</html>
